name: Build and Push Docker Images

on:
  push:
    branches: [v2]
    paths:
      - 'syslog-receiver/**'
      - 'dashboard/**'
      - 'license-checker/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-images.yml'

env:
  REGISTRY: ghcr.io
  OWNER: plan-b-systems

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: syslog-receiver
            image: siem-syslog
          - context: dashboard
            image: siem-dashboard
          - context: license-checker
            image: siem-license-checker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:v2
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
