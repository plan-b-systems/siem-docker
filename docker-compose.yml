# ============================================================
# Plan-B Systems SIEM Stack — v2
# OpenSearch 2.x + Syslog Receiver + Dashboard + License Checker
# No Graylog, no MongoDB
# Run via install.sh or: docker compose --env-file config.env up -d
# ============================================================

networks:
  siem-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  siem-internal:
    driver: bridge
    internal: true  # no external access — backend only
    ipam:
      config:
        - subnet: 172.20.1.0/24

volumes:
  opensearch-data:
  license-data:

services:

  # ── OpenSearch ───────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: plansb-opensearch
    restart: unless-stopped
    networks:
      - siem-internal
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    environment:
      cluster.name: "plansb-cluster"
      node.name: "opensearch-node1"
      discovery.type: "single-node"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP_SIZE:-2g} -Xmx${OPENSEARCH_HEAP_SIZE:-2g}"
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"  # Mitigated: OpenSearch on internal-only network, no external port exposure
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      indices.query.bool.max_clause_count: "32768"
      action.auto_create_index: "true"
      cluster.routing.allocation.disk.watermark.low: "80%"
      cluster.routing.allocation.disk.watermark.high: "${DISK_WATERMARK_HIGH:-85}%"
      cluster.routing.allocation.disk.watermark.flood_stage: "${DISK_WATERMARK_FLOOD:-92}%"
      TZ: "${TIMEZONE:-Asia/Jerusalem}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?pretty | grep -q '\"status\"'"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      com.planbsystems.role: "opensearch"
      com.planbsystems.client: "${CLIENT_NAME}"

  # ── Syslog Receiver ─────────────────────────────────────
  syslog-receiver:
    build:
      context: ./syslog-receiver
      dockerfile: Dockerfile
    image: plansb-syslog:latest
    container_name: plansb-syslog
    restart: unless-stopped
    networks:
      - siem-net       # external: receive syslog from network devices
      - siem-internal  # internal: write to OpenSearch
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: "http://opensearch:9200"
      CLIENT_ID: "${CLIENT_ID}"
      CLIENT_NAME: "${CLIENT_NAME}"
      RETENTION_DAYS: "${RETENTION_DAYS:-730}"
      TZ: "${TIMEZONE:-Asia/Jerusalem}"
    ports:
      - "0.0.0.0:${SYSLOG_UDP_PORT:-514}:514/udp"
      - "0.0.0.0:${SYSLOG_TCP_PORT:-1514}:1514/tcp"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').createConnection(1514,'localhost').on('connect',()=>{console.log('ok');process.exit(0)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      com.planbsystems.role: "syslog-receiver"
      com.planbsystems.client: "${CLIENT_NAME}"

  # ── Dashboard ────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: plansb-dashboard:latest
    container_name: plansb-dashboard
    restart: unless-stopped
    networks:
      - siem-net       # external: web UI
      - siem-internal  # internal: query OpenSearch
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: "http://opensearch:9200"
      CLIENT_ID: "${CLIENT_ID}"
      CLIENT_NAME: "${CLIENT_NAME}"
      DASHBOARD_PASSWORD_HASH: "${DASHBOARD_PASSWORD_HASH}"
      JWT_SECRET: "${JWT_SECRET}"
      TIMEZONE: "${TIMEZONE:-Asia/Jerusalem}"
      RETENTION_DAYS: "${RETENTION_DAYS:-730}"
      LICENSE_API_URL: "${LICENSE_API_URL:-https://siemsys.plan-b.systems/api/license/check}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
      TZ: "${TIMEZONE:-Asia/Jerusalem}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health -o /dev/null && echo ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      com.planbsystems.role: "dashboard"
      com.planbsystems.client: "${CLIENT_NAME}"

  # ── License Checker ──────────────────────────────────────
  license-checker:
    build:
      context: ./license-checker
      dockerfile: Dockerfile
    image: plansb-license-checker:latest
    container_name: plansb-license-checker
    restart: unless-stopped
    networks:
      - siem-net       # external: API calls to license server
      - siem-internal  # internal: health checks on containers
    depends_on:
      syslog-receiver:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    volumes:
      - license-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LICENSE_API_URL: "${LICENSE_API_URL:-https://siemsys.plan-b.systems/api/license/check}"
      CLIENT_ID: "${CLIENT_ID}"
      GRACE_PERIOD_DAYS: "${GRACE_PERIOD_DAYS:-7}"
      SYSLOG_CONTAINER: "plansb-syslog"
      OPENSEARCH_CONTAINER: "plansb-opensearch"
      DASHBOARD_CONTAINER: "plansb-dashboard"
      STATE_FILE: "/data/license_state.json"
      LOG_FILE: "/data/license_checker.log"
      TZ: "${TIMEZONE:-Asia/Jerusalem}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      com.planbsystems.role: "license-checker"
      com.planbsystems.client: "${CLIENT_NAME}"
